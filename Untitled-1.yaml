/user/transactions:
    get:
        tags:
            - Transactions
        summary: Récupérer les transactions
        description: Récupère la liste des transactions d'un utilisateur pour un compte donné.
        parameters:
            - in: query
              name: accountId
              required: true
              type: string
              description: ID du compte bancaire concerné

            - in: query
              name: month
              required: false
              type: integer
              description: Mois des transactions (1-12)

            - in: query
              name: year
              required: false
              type: integer
              description: Année des transactions

        produces:
            - application/json

        security:
            - bearerAuth: []

        responses:
            "200":
                description: Transactions récupérées avec succès
                schema:
                    $ref: "#/definitions/TransactionList"
            "400":
                description: Paramètres invalides
            "500":
                description: Erreur interne du serveur
